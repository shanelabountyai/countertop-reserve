name: CI

on:
  push:
    branches: [main]
    # A docs-only push cannot break the gate, and the "record the SHA" commit
    # that follows every backlog item touches nothing else.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # Manual trigger — Countertop's first push needed this because paths-ignore
  # on a new branch is evaluated against the head commit alone, and the head
  # commit of every backlog item is the docs-only "record the SHA" one.
  workflow_dispatch:

# Pushing twice in quick succession should not pay for the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reserve_ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/reserve_ci
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reserve_ci_shadow

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      - name: Create throwaway databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE reserve_ci;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE reserve_ci_shadow;"

      # Migrations applied from scratch against a throwaway Postgres. Never
      # `db push` — V-003's hand-written allocation constraint and event-log
      # trigger only exist in migration files, and a schema pushed straight
      # from schema.prisma silently drops every one of them.
      - name: Apply migrations from scratch
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      # Generated by `postinstall` during `npm ci`. Default Prisma client
      # output (node_modules/.prisma/client) from day one — Countertop's
      # generated-into-packages/db client made itself unexcludable from the
      # Turbopack bundle and cost three deploys (see that repo's WRITEUP.md).
      - name: Assert generated artifacts exist
        run: test -d node_modules/.prisma/client || (echo "Prisma client missing - postinstall did not run" && exit 1)

      # schema.prisma must match what the committed migration history
      # produces. Without this, a hand-edited migration and the schema drift
      # apart and every local test passes against a database CI can never
      # rebuild.
      - name: Drift check (schema.prisma vs migration history)
        run: >
          npx prisma migrate diff
          --from-migrations packages/db/prisma/migrations
          --to-schema-datamodel packages/db/prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

      # CLAUDE.md: identical results under any process TZ. The pacing-bucket
      # and quiet-hours-boundary questions are restaurant-timezone questions;
      # a UTC-only CI hides exactly the bugs that rule exists to catch.
      - name: Unit suite — TZ=UTC
        run: npm test
        env:
          TZ: UTC
      - name: Unit suite — TZ=Pacific/Kiritimati
        run: npm test
        env:
          TZ: Pacific/Kiritimati

      # The build is its own step, before Playwright can bury it — Countertop
      # learned this twice (C-024) so this project doesn't have to.
      - name: Production build
        run: npm run build:test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: e2e (production build, port 3500)
        run: npm run test:e2e
        env:
          CI: true
          PORT: 3500
